<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:1fr;gap:12px">
      <sc-for list="{{ items }}" as="s" hint-placeholder-count="4">
        <a href="#/services/{{ s.slug }}" style="display:flex;align-items:center;gap:16px;min-height:80px;padding:12px 16px 12px 12px;background:#fff;border:1px solid #E2DFD8;border-radius:16px;text-decoration:none;color:#10233B;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s" style-hover="transform:translateY(-3px);box-shadow:0 12px 28px rgba(16,24,40,.10);border-color:#C9E5E8" style-active="transform:scale(.985)">
          <div style="flex:none;width:56px;height:56px;border-radius:12px;background:#E8F4F5;overflow:hidden"><image-slot id="ill-{{ s.slug }}" src="{{ s.img }}" credit="{{ s.credit }}" credit-href="{{ s.href }}" shape="rounded" radius="12" placeholder="{{ s.short }} icon"></image-slot></div>
          <div style="flex:1;min-width:0">
            <div style="font:600 16px/1.3 'DM Sans',sans-serif">{{ s.short }}</div>
            <div style="font:400 13.5px/1.45 'DM Sans',sans-serif;color:#646D79;margin-top:2px">{{ s.summary }}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#137C8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px">
      <sc-for list="{{ items }}" as="s" hint-placeholder-count="4">
        <a href="#/services/{{ s.slug }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:24px 24px 26px;background:#fff;border:1px solid #E2DFD8;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.04);text-decoration:none;color:#10233B;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;min-height:100%" style-hover="transform:translateY(-6px);box-shadow:0 12px 28px rgba(16,24,40,.12);border-color:#C9E5E8" style-active="transform:scale(.985)">
          <div style="width:100%;aspect-ratio:4/3;border-radius:14px;background:#E8F4F5;overflow:hidden;margin-bottom:20px"><image-slot id="ill-{{ s.slug }}" src="{{ s.img }}" credit="{{ s.credit }}" credit-href="{{ s.href }}" shape="rounded" radius="14" placeholder="{{ s.short }} illustration (1:1 isometric SVG)"></image-slot></div>
          <div style="font-family:'Manrope',sans-serif;font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.01em">{{ s.short }}</div>
          <div style="font:400 14.5px/1.5 'DM Sans',sans-serif;color:#646D79;margin-top:8px;flex:1">{{ s.summary }}</div>
          <div style="display:inline-flex;align-items:center;gap:6px;margin-top:18px;font:600 14px/1 'DM Sans',sans-serif;color:#137C8B">Explore this service <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></div>
        </a>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1240px&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Service[]&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const compact = !!this.props.compact;
    return { items: this.props.items ?? [], compact, full: !compact };
  }
}
</script>
</body>
</html>
